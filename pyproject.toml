[project]
name = "iel-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andregarcia0412", email = "andregarcia0412@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
]

[project.scripts]
iel-hackathon = "iel_hackathon:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
